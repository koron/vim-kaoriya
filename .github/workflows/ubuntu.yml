name: Ubuntu Build

on:
  workflow_call:

concurrency:
  group: ci-ubuntu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build on Ubuntu (Linux)
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:

    - name: Checkout repository with submodules
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Uninstall snap
      run: |
        sudo bash vim/ci/remove_snap.sh

    - name: Update and upgrade packages
      run: |
        sudo apt update
        sudo apt upgrade -y --allow-downgrades

    - name: Install packages
      run: |
        PACKAGES=()
        PACKAGES+=( gettext )
        PACKAGES+=( libxt-dev libgtk-3-dev )
        PACKAGES+=( luajit libluajit-5.1-dev )
        PACKAGES+=( python3-dev )
        PACKAGES+=( ruby-dev )
        sudo apt install -y --allow-downgrades "${PACKAGES[@]}"

    - name: Apply kaoriya patches
      working-directory: vim
      run: |
        cat ../patches/master/series | while read line ; do
          echo "Applying patch: ${line}"
          patch -p1 < "../patches/master/${line}"
        done

    - name: Configure
      working-directory: build/linux
      run: make vim-configure

    - name: Build
      working-directory: build/linux
      run: make vim-build

    - name: Create archives
      working-directory: build/linux
      run: |
        make vim-install \
             kaoriya-install \
             autofmt-install \
             package

    - name: Upload archives as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ubuntu-archives
        path: |
          build/linux/vim*-kaoriya-linux-*.tar.bz2
        if-no-files-found: error

    - name: Test
      continue-on-error: true
      working-directory: vim/src/testdir
      run: |
        make -f Makefile
      env:
        VIM_CLIENTSERVER: socket

    - name: Upload test result
      uses: actions/upload-artifact@v7
      with:
        name: ubuntu-test_result
        path: |
          vim/src/testdir/test_result.log
          vim/src/testdir/test*.failed
          vim/src/testdir/messages
        if-no-files-found: error
